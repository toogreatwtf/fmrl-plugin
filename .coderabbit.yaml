# CodeRabbit runs on a metered allowance (Essentials: a few reviews an hour,
# and fewer the more the last seven days used). The defaults review every push
# of every PR, drafts included, so PR #2 spent its reviews on intermediate
# pushes and hit "Review limit reached" on the third push of the day, with
# the organization (markymd included) already at its spending cap. This
# points it at finished work.
#
# The flow: open PRs as drafts (not reviewed), mark ready when `npm test` in
# packages/mcp is green (one review), and after fixes ask once with
# `@coderabbitai review`. Modelled on toogreatwtf/markymd's .coderabbit.yaml;
# the rationale is markymd's docs/superpowers/observations/log.md,
# Observation 29.
language: en-US

reviews:
  profile: chill
  high_level_summary: true
  review_status: false
  collapse_walkthrough: true
  poem: false

  # Exclude what a reviewer cannot act on: lockfiles, compiled output if
  # it is ever committed, and the crypto interop fixtures (generated by
  # packages/mcp/scripts/fixture.ts, not written by hand).
  path_filters:
    - "!**/package-lock.json"
    - "!packages/mcp/dist/**"
    - "!packages/mcp/test/fixtures/**"

  auto_review:
    enabled: true
    drafts: false
    # One review when the PR opens or is marked ready; never on each push.
    auto_incremental_review: false
    # Docs-only PRs carry no code.
    ignore_title_keywords:
      - "docs:"

  pre_merge_checks:
    # The coverage check warned on every PR (47.83% against 80% on PR #2).
    # The MCP tools are described by their zod schemas, not JSDoc, so the
    # number is noise here rather than a signal.
    docstrings:
      mode: "off"
