# Publishes fmrl-mcp to npm and lists it in the MCP Registry. Anyone who
# runs `npx -y fmrl-mcp` from their own MCP config, and any plugin from
# before 0.17.2, starts whatever is `latest` on npm. Plugins from 0.17.2 on
# pin an exact version in plugins/fmrl/.mcp.json, so they run a new server
# only once a later PR moves that pin, which must come after this publish.
# A merge to main whose packages/mcp/package.json names a version npm does
# not yet have is the release; a merge that leaves the version alone
# publishes nothing.
#
# Auth is npm Trusted Publishing: the job presents a GitHub OIDC token, npm
# checks it against the trusted publisher configured on the package
# (toogreatwtf/fmrl-plugin, workflow release.yml), and the publish carries a
# provenance attestation back to this commit. No npm token lives in secrets;
# `id-token: write` is what lets the job mint the OIDC token. Trusted
# publishing needs npm 11.5.1+, which Node 22's bundled npm is not, hence
# the pinned `npm install -g npm@11.21.1` step.
#
# A publish runs only for a commit on main, and only after a maintainer
# approves it in the npm-release environment, which npm's trusted publisher
# names. Actions are pinned to commit SHAs and npm to an exact version.
#
# The same approved job then lists the version in the official MCP Registry
# (registry.modelcontextprotocol.io) under io.github.toogreatwtf/fmrl-mcp,
# from packages/mcp/server.json, logging in with the GitHub OIDC token it
# already holds for npm. mcp-publisher is built with `go install` at a
# pinned tag, so its module checksums are checked against the Go checksum
# database rather than trusting a `latest` download. npm and the registry
# are each checked on their own, so a run that reached npm but failed to
# list the version lists it when re-run (or run by hand on main), instead of
# finishing green with the version unlisted.
#
# The version check runs first, in its own job with no environment and no
# id-token permission, so a merge that leaves the version alone finishes
# green without asking anyone to approve anything. Only when npm or the
# registry does not have the version yet does the publish job start and
# wait for approval. The check decides only whether to ask; it cannot
# publish, and the publish job checks npm again itself before it touches
# anything.
name: release

on:
  push:
    branches: [main]
    paths:
      - packages/mcp/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: is fmrl-mcp's version new?
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      version: ${{ steps.gate.outputs.version }}
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Published only if npm answers with this exact version; new only on
      # npm's 404. Listed only on the registry's 200; missing only on its
      # 404. Anything else (an outage) fails the run instead of guessing
      # either way.
      - name: is this version already on npm and in the MCP Registry?
        id: gate
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./server.json').name")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if found="$(npm view "fmrl-mcp@${version}" version 2>npm-view.err)"; then
            if [ "$found" != "$version" ]; then
              echo "npm answered '${found}' for fmrl-mcp@${version}; refusing to guess." >&2
              exit 1
            fi
            npm=published
          elif grep -q "E404" npm-view.err; then
            npm=new
          else
            cat npm-view.err >&2
            exit 1
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/${name/\//%2F}/versions/${version}")"
          case "$code" in
            200) registry=listed ;;
            404) registry=missing ;;
            *) echo "the MCP Registry answered HTTP ${code} for ${name}@${version}; refusing to guess." >&2; exit 1 ;;
          esac
          if [ "$npm" = published ] && [ "$registry" = listed ]; then
            echo "fmrl-mcp@${version} is on npm and in the MCP Registry; nothing to do, no approval needed."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "fmrl-mcp@${version}: npm ${npm}, MCP Registry ${registry}; the publish job will wait for approval in npm-release."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: publish fmrl-mcp ${{ needs.check.outputs.version }}
    needs: check
    if: github.ref == 'refs/heads/main' && needs.check.outputs.publish == 'true'
    environment: npm-release
    runs-on: ubuntu-latest
    # One publish at a time, and never cancel one in flight: a cancelled
    # publish is the one state that is hard to reason about. The lock is on
    # this job, not the workflow, so a check never queues behind a publish
    # that is waiting for approval.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json
      - name: npm 11.5.1+ for trusted publishing
        run: npm install -g npm@11.21.1 && npm --version
      - name: is this version already on npm and in the MCP Registry?
        id: gate
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./server.json').name")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if found="$(npm view "fmrl-mcp@${version}" version 2>npm-view.err)"; then
            if [ "$found" != "$version" ]; then
              echo "npm answered '${found}' for fmrl-mcp@${version}; refusing to guess." >&2
              exit 1
            fi
            echo "fmrl-mcp@${version} is already on npm; not publishing it there."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q "E404" npm-view.err; then
            echo "fmrl-mcp@${version} is not on npm yet; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat npm-view.err >&2
            exit 1
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/${name/\//%2F}/versions/${version}")"
          case "$code" in
            200) echo "${name}@${version} is already in the MCP Registry; not listing it again."
                 echo "list=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "${name}@${version} is not in the MCP Registry yet; listing it after npm."
                 echo "list=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "the MCP Registry answered HTTP ${code} for ${name}@${version}; refusing to guess." >&2; exit 1 ;;
          esac
      - if: steps.gate.outputs.publish == 'true'
        run: npm ci
      # prepublishOnly (package.json) runs the build and the test suite
      # again right before the tarball is made, so a publish never ships
      # what the test workflow did not see.
      - if: steps.gate.outputs.publish == 'true'
        name: publish fmrl-mcp@${{ steps.gate.outputs.version }}
        run: npm publish --access public
      - if: steps.gate.outputs.list == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          cache: false
      - if: steps.gate.outputs.list == 'true'
        name: mcp-publisher v1.8.8
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/modelcontextprotocol/registry/cmd/publisher@v1.8.8
          "$RUNNER_TEMP/bin/publisher" --help >/dev/null
      - if: steps.gate.outputs.list == 'true'
        name: list fmrl-mcp@${{ steps.gate.outputs.version }} in the MCP Registry
        # The registry checks the version against npm when it lists it, and
        # npm can take a few minutes to serve a version it has just taken:
        # 0.17.6 was refused with a 400 ("NPM package 'fmrl-mcp' ...") seconds
        # after its publish. So wait until npm's registry answers for this
        # exact version, then try the listing a few times with backoff. Each
        # try logs in again, since the OIDC login is short-lived.
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          "$RUNNER_TEMP/bin/publisher" validate
          for wait in 0 10 20 30 60 60 60 60; do
            sleep "$wait"
            # A dropped connection prints 000 and must not end the step under bash -e.
            code="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/fmrl-mcp/${VERSION}" || true)"
            if [ "$code" = 200 ]; then break; fi
            echo "npm answers HTTP ${code} for fmrl-mcp@${VERSION}; waiting for it to show."
          done
          if [ "$code" != 200 ]; then
            echo "npm still does not serve fmrl-mcp@${VERSION}; re-run this job once it does." >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if "$RUNNER_TEMP/bin/publisher" login github-oidc && "$RUNNER_TEMP/bin/publisher" publish; then
              exit 0
            fi
            if [ "$attempt" = 5 ]; then break; fi
            backoff=$((attempt * 30))
            echo "listing try ${attempt} failed; trying again in ${backoff}s."
            sleep "$backoff"
          done
          echo "the MCP Registry refused fmrl-mcp@${VERSION} five times; re-run this job to try again." >&2
          exit 1
