# Publishes fmrl-mcp to npm and lists it in the MCP Registry. Anyone who
# runs `npx -y fmrl-mcp` from their own MCP config, and any plugin from
# before 0.17.2, starts whatever is `latest` on npm. Plugins from 0.17.2 on
# pin an exact version in plugins/fmrl/.mcp.json, so they run a new server
# only once a later PR moves that pin, which must come after this publish.
# A merge to main whose packages/mcp/package.json names a version npm does
# not yet have is the release; a merge that leaves the version alone
# publishes nothing.
#
# Auth is npm Trusted Publishing: the job presents a GitHub OIDC token, npm
# checks it against the trusted publisher configured on the package
# (toogreatwtf/fmrl-plugin, workflow release.yml), and the publish carries a
# provenance attestation back to this commit. No npm token lives in secrets;
# `id-token: write` is what lets the job mint the OIDC token. Trusted
# publishing needs npm 11.5.1+, which Node 22's bundled npm is not, hence
# the pinned `npm install -g npm@11.21.1` step.
#
# One-time setup, on npmjs.com, package fmrl-mcp → Settings → Trusted
# publisher → GitHub Actions: organization `toogreatwtf`, repository
# `fmrl-plugin`, workflow filename `release.yml`, environment `npm-release`.
# Until that is done the publish step fails with 404/E401 and nothing else
# happens.
#
# A publish runs only for a commit on main, and waits in the npm-release
# environment, which npm's trusted publisher names. Who may approve it is
# set by that environment's protection rules in the repository settings,
# not by this file. Actions are pinned to commit SHAs and npm to an exact
# version.
#
# The same approved job then lists the version in the official MCP Registry
# (registry.modelcontextprotocol.io) under io.github.toogreatwtf/fmrl-mcp,
# from packages/mcp/server.json, logging in with the GitHub OIDC token it
# already holds for npm. mcp-publisher is built with `go install` at a
# pinned tag, so its module checksums are checked against the Go checksum
# database rather than trusting a `latest` download. npm and the registry
# are each checked on their own, so a run that reached npm but failed to
# list the version lists it when re-run (or run by hand on main), instead of
# finishing green with the version unlisted.
#
# After a successful publish, the tag job (tag-release.yml) tags the version
# as v<version> on the commit npm recorded for it and writes a GitHub
# Release with the PRs since the previous version. The check job puts the
# same notes on the run's summary page, so they're there to read when the
# publish waits for approval.
#
# The version check runs first, in its own job with no environment and no
# id-token permission, so a merge that leaves the version alone finishes
# green without asking anyone to approve anything. Only when npm or the
# registry does not have the version yet does the publish job start and
# wait for approval. The check decides only whether to ask; it cannot
# publish, and the publish job checks npm again itself before it touches
# anything.
#
# Installing dependencies, building, testing and packing happen in the build
# job, which has no id-token permission and no environment. It packs the
# tarball and uploads it as an artifact of this run. The publish job, the
# only one that can mint the OIDC token, installs no dependencies and runs no
# package scripts: it downloads that tarball, checks it is the one the build
# job made, for this version and this commit, and publishes the file as it
# is. The tarball carries gitHead (this commit), which a directory publish
# would have added by itself, so the tag job still finds the commit on npm.
name: release

on:
  push:
    branches: [main]
    paths:
      - packages/mcp/**
      - .github/workflows/release.yml
      - .github/workflows/tag-release.yml
      - .github/scripts/release-notes.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: is fmrl-mcp's version new?
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      build: ${{ steps.gate.outputs.build }}
      version: ${{ steps.gate.outputs.version }}
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Published only if npm answers with this exact version; new only on
      # npm's 404. Listed only on the registry's 200; missing only on its
      # 404. Anything else (an outage) fails the run instead of guessing
      # either way.
      - name: is this version already on npm and in the MCP Registry?
        id: gate
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./server.json').name")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if found="$(npm view "fmrl-mcp@${version}" version 2>npm-view.err)"; then
            if [ "$found" != "$version" ]; then
              echo "npm answered '${found}' for fmrl-mcp@${version}; refusing to guess." >&2
              exit 1
            fi
            npm=published
          elif grep -q "E404" npm-view.err; then
            npm=new
          else
            cat npm-view.err >&2
            exit 1
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/${name/\//%2F}/versions/${version}")"
          case "$code" in
            200) registry=listed ;;
            404) registry=missing ;;
            *) echo "the MCP Registry answered HTTP ${code} for ${name}@${version}; refusing to guess." >&2; exit 1 ;;
          esac
          if [ "$npm" = published ] && [ "$registry" = listed ]; then
            echo "fmrl-mcp@${version} is on npm and in the MCP Registry; nothing to do, no approval needed."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "fmrl-mcp@${version}: npm ${npm}, MCP Registry ${registry}; the publish job will wait for approval in npm-release."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          # Only a version npm lacks needs a tarball; one that is on npm and
          # only needs listing skips the build job.
          if [ "$npm" = new ]; then echo "build=true" >> "$GITHUB_OUTPUT"; fi
      # The notes for this version, on the run's summary page, which is where
      # the approval is given. The same notes go on the GitHub Release once
      # the publish is through.
      - name: release notes
        if: steps.gate.outputs.publish == 'true'
        working-directory: .
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: .github/scripts/release-notes.sh "$VERSION" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  # Builds, tests and packs fmrl-mcp, with no id-token and no environment, so
  # dependency code never runs where the publish token can be minted.
  build:
    name: build fmrl-mcp ${{ needs.check.outputs.version }}
    needs: check
    if: github.ref == 'refs/heads/main' && needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: pack fmrl-mcp@${{ needs.check.outputs.version }}
        id: pack
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if [ "$(node -p "require('./package.json').version")" != "$VERSION" ]; then
            echo "package.json no longer names ${VERSION}; refusing to pack." >&2
            exit 1
          fi
          # A directory publish records the commit as gitHead by itself; a
          # tarball publish takes it from the tarball's package.json.
          npm pkg set gitHead="$GITHUB_SHA"
          # --ignore-scripts: no lifecycle script (prepack, prepare,
          # prepublishOnly) runs in a release. Anything the tarball needs
          # must be a step of this job, before this one.
          npm pack --ignore-scripts
          tarball="fmrl-mcp-${VERSION}.tgz"
          test -f "$tarball"
          echo "sha256=$(sha256sum "$tarball" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fmrl-mcp-tarball
          path: packages/mcp/fmrl-mcp-${{ needs.check.outputs.version }}.tgz
          if-no-files-found: error
          compression-level: 0
          # The approval can wait up to 30 days; keep the tarball that long
          # whatever the repository's default retention is. (A lower
          # repository or organization maximum still wins.)
          retention-days: 30

  publish:
    name: publish fmrl-mcp ${{ needs.check.outputs.version }}
    needs: [check, build]
    # The build job is skipped when the version is already on npm and only
    # needs listing, so a skipped build must not skip this job; a failed one
    # must.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.check.outputs.publish == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    environment: npm-release
    runs-on: ubuntu-latest
    # One publish at a time, and never cancel one in flight: a cancelled
    # publish is the one state that is hard to reason about. The lock is on
    # this job, not the workflow, so a check never queues behind a publish
    # that is waiting for approval.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache here: this job installs no dependencies.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1+ for trusted publishing
        run: npm install -g --ignore-scripts npm@11.21.1 && npm --version
      - name: is this version already on npm and in the MCP Registry?
        id: gate
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./server.json').name")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if found="$(npm view "fmrl-mcp@${version}" version 2>npm-view.err)"; then
            if [ "$found" != "$version" ]; then
              echo "npm answered '${found}' for fmrl-mcp@${version}; refusing to guess." >&2
              exit 1
            fi
            echo "fmrl-mcp@${version} is already on npm; not publishing it there."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q "E404" npm-view.err; then
            echo "fmrl-mcp@${version} is not on npm yet; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat npm-view.err >&2
            exit 1
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/${name/\//%2F}/versions/${version}")"
          case "$code" in
            200) echo "${name}@${version} is already in the MCP Registry; not listing it again."
                 echo "list=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "${name}@${version} is not in the MCP Registry yet; listing it after npm."
                 echo "list=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "the MCP Registry answered HTTP ${code} for ${name}@${version}; refusing to guess." >&2; exit 1 ;;
          esac
      # The tarball the build job made, built and tested there. Nothing is
      # installed or built here, and no package script runs.
      - if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fmrl-mcp-tarball
          path: ${{ runner.temp }}/tarball
      - if: steps.gate.outputs.publish == 'true'
        name: check the tarball
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          DIR: ${{ runner.temp }}/tarball
        run: |
          tarball="${DIR}/fmrl-mcp-${VERSION}.tgz"
          if [ "$(ls -A "$DIR")" != "fmrl-mcp-${VERSION}.tgz" ]; then
            echo "expected only fmrl-mcp-${VERSION}.tgz from the build job; found: $(ls -A "$DIR")" >&2
            exit 1
          fi
          if [ "$(sha256sum "$tarball" | cut -d' ' -f1)" != "$SHA256" ]; then
            echo "the tarball is not the one the build job packed; refusing to publish." >&2
            exit 1
          fi
          tar -xzOf "$tarball" package/package.json > "${RUNNER_TEMP}/packed.json"
          node -e '
            const p = require(process.argv[1]);
            const want = { name: "fmrl-mcp", version: process.env.VERSION, gitHead: process.env.GITHUB_SHA };
            for (const [k, v] of Object.entries(want)) {
              if (p[k] !== v) { console.error(`the tarball says ${k} ${p[k]}, not ${v}; refusing to publish.`); process.exit(1); }
            }
          ' "${RUNNER_TEMP}/packed.json"
      - if: steps.gate.outputs.publish == 'true'
        name: publish fmrl-mcp@${{ steps.gate.outputs.version }}
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: npm publish "${RUNNER_TEMP}/tarball/fmrl-mcp-${VERSION}.tgz" --access public --ignore-scripts
      - if: steps.gate.outputs.list == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
          cache: false
      - if: steps.gate.outputs.list == 'true'
        name: mcp-publisher v1.8.8
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/modelcontextprotocol/registry/cmd/publisher@v1.8.8
          "$RUNNER_TEMP/bin/publisher" --help >/dev/null
      - if: steps.gate.outputs.list == 'true'
        name: list fmrl-mcp@${{ steps.gate.outputs.version }} in the MCP Registry
        # The registry checks the version against npm when it lists it, and
        # npm can take a few minutes to serve a version it has just taken:
        # 0.17.6 was refused with a 400 ("NPM package 'fmrl-mcp' ...") seconds
        # after its publish. So wait until npm's registry answers for this
        # exact version, then try the listing a few times with backoff. Each
        # try logs in again, since the OIDC login is short-lived.
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          "$RUNNER_TEMP/bin/publisher" validate
          for wait in 0 10 20 30 60 60 60 60; do
            sleep "$wait"
            # A dropped connection prints 000 and must not end the step under bash -e.
            code="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/fmrl-mcp/${VERSION}" || true)"
            if [ "$code" = 200 ]; then break; fi
            echo "npm answers HTTP ${code} for fmrl-mcp@${VERSION}; waiting for it to show."
          done
          if [ "$code" != 200 ]; then
            echo "npm still does not serve fmrl-mcp@${VERSION}; re-run this job once it does." >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if "$RUNNER_TEMP/bin/publisher" login github-oidc && "$RUNNER_TEMP/bin/publisher" publish; then
              exit 0
            fi
            if [ "$attempt" = 5 ]; then break; fi
            backoff=$((attempt * 30))
            echo "listing try ${attempt} failed; trying again in ${backoff}s."
            sleep "$backoff"
          done
          echo "the MCP Registry refused fmrl-mcp@${VERSION} five times; re-run this job to try again." >&2
          exit 1

  # Once the approved publish is through, tag the version and write its
  # GitHub Release (tag-release.yml). This job only touches git tags and
  # releases; it has no id-token and cannot publish.
  tag:
    name: tag fmrl-mcp ${{ needs.check.outputs.version }}
    needs: [check, publish]
    # !cancelled(): without a status function, a skipped build job upstream
    # would skip this job too.
    if: "!cancelled() && github.ref == 'refs/heads/main' && needs.publish.result == 'success'"
    permissions:
      contents: write
    uses: ./.github/workflows/tag-release.yml
    with:
      version: ${{ needs.check.outputs.version }}
