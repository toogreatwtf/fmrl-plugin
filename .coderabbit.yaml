# CodeRabbit reviews finished work, not every push: open PRs as drafts (not
# reviewed), mark ready when `npm test` in packages/mcp is green (one
# review), and after fixes ask once with `@coderabbitai review`.
language: en-US

reviews:
  profile: chill
  high_level_summary: true
  review_status: false
  collapse_walkthrough: true
  poem: false

  # Exclude what a reviewer cannot act on: lockfiles, compiled output if
  # it is ever committed, and the crypto interop fixtures (generated by
  # packages/mcp/scripts/fixture.ts, or copied byte-for-byte from the
  # upstream server repository's internal/crypto/testdata — never written
  # by hand).
  path_filters:
    - "!**/package-lock.json"
    - "!packages/mcp/dist/**"
    - "!packages/mcp/test/fixtures/**"

  auto_review:
    enabled: true
    drafts: false
    # One review when the PR opens or is marked ready; never on each push.
    auto_incremental_review: false
    # Docs-only PRs carry no code.
    ignore_title_keywords:
      - "docs:"

  pre_merge_checks:
    # The coverage check warned on every PR.
    # The MCP tools are described by their zod schemas, not JSDoc, so the
    # number is noise here rather than a signal.
    docstrings:
      mode: "off"
