# The npm publish is half the deploy: anyone who runs `npx -y fmrl-mcp` from
# their own MCP config, and any plugin from before 0.17.2, starts whatever is
# `latest` on npm. Plugins from 0.17.2 on pin an exact version in
# plugins/fmrl/.mcp.json, so they run a new server only once a later PR moves
# that pin, which must come after this publish. Until this workflow the
# publish was a laptop step (`npm login`, `npm publish`), so a fix merged to
# main stayed unshipped until someone remembered. Now a merge to main whose
# packages/mcp/package.json names a version npm does not yet have is the
# release; a merge that leaves the version alone publishes nothing.
#
# Auth is npm Trusted Publishing: the job presents a GitHub OIDC token, npm
# checks it against the trusted publisher configured on the package
# (toogreatwtf/fmrl-plugin, workflow release.yml), and the publish carries a
# provenance attestation back to this commit. No npm token lives in secrets;
# `id-token: write` is what lets the job mint the OIDC token. Trusted
# publishing needs npm 11.5.1+, which Node 22's bundled npm is not, hence
# the pinned `npm install -g npm@11.21.1` step.
#
# One-time setup, on npmjs.com, package fmrl-mcp → Settings → Trusted
# publisher → GitHub Actions: organization `toogreatwtf`, repository
# `fmrl-plugin`, workflow filename `release.yml`, environment `npm-release`.
# Until that is done the publish step fails with 404/E401 and nothing else
# happens.
#
# Because what this job publishes reaches users' machines, a publish
# needs three things:
#   - the commit is on main (the job refuses any other ref, including a
#     workflow_dispatch pointed at a branch);
#   - the `npm-release` environment's required reviewer approves the run
#     (repository Settings → Environments → npm-release: required
#     reviewers, deployment branches limited to main, and "Prevent
#     self-review" on);
#   - npm's trusted publisher names that environment, so an OIDC token from
#     any other job or branch is refused at npm.
# So a leaked login with write access that is not a required reviewer
# cannot ship code to users. What it does not stop: a leaked reviewer login
# can approve a run someone else started, and approve its own too unless
# "Prevent self-review" is on with a second reviewer to do the approving;
# and a leaked admin login can change these settings. Those need 2FA and
# a second reviewer, not workflow YAML.
# Actions are pinned to commit SHAs and npm to an exact version, because
# this job holds the one credential that reaches every user's machine.
#
# The version check runs first, in its own job with no environment and no
# id-token permission, so a merge that leaves the version alone finishes
# green without asking anyone to approve anything. Only when npm does not
# have the version yet does the publish job start and wait in npm-release.
# The check decides only whether to ask; it cannot publish, and the publish
# job checks npm again itself before it touches anything.
name: release

on:
  push:
    branches: [main]
    paths:
      - packages/mcp/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never cancel one in flight: a cancelled
# publish is the one state that is hard to reason about.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: is fmrl-mcp's version new?
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      version: ${{ steps.gate.outputs.version }}
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Published only if npm answers with this exact version; new only on
      # npm's 404. Anything else (a registry outage) fails the run instead
      # of guessing either way.
      - name: is this version already on npm?
        id: gate
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if found="$(npm view "fmrl-mcp@${version}" version 2>npm-view.err)"; then
            if [ "$found" = "$version" ]; then
              echo "fmrl-mcp@${version} is already published; nothing to do, no approval needed."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "npm answered '${found}' for fmrl-mcp@${version}; refusing to guess." >&2
            exit 1
          fi
          if grep -q "E404" npm-view.err; then
            echo "fmrl-mcp@${version} is not on npm yet; the publish job will wait for approval in npm-release."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat npm-view.err >&2
          exit 1

  publish:
    name: publish fmrl-mcp ${{ needs.check.outputs.version }}
    needs: check
    if: github.ref == 'refs/heads/main' && needs.check.outputs.publish == 'true'
    environment: npm-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json
      - name: npm 11.5.1+ for trusted publishing
        run: npm install -g npm@11.21.1 && npm --version
      - name: is this version already on npm?
        id: gate
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "fmrl-mcp@${version}" version >/dev/null 2>&1; then
            echo "fmrl-mcp@${version} is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "fmrl-mcp@${version} is not on npm yet; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.publish == 'true'
        run: npm ci
      # prepublishOnly (package.json) runs the build and the test suite
      # again right before the tarball is made, so a publish never ships
      # what the test workflow did not see.
      - if: steps.gate.outputs.publish == 'true'
        name: publish fmrl-mcp@${{ steps.gate.outputs.version }}
        run: npm publish --access public
